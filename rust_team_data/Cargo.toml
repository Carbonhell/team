[package]
name = "rust_team_data"
version = "1.0.0"
edition = "2018"
license.workspace = true

[dependencies]
hex = { workspace = true, optional = true }
indexmap = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
age = {workspace = true, optional = true, default-features = false}

[features]
email-encryption = ["age", "hex"]
